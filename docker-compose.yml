version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: voice2sense-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: voice2sense_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d voice2sense_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: voice2sense-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: voice2sense-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/voice2sense_db
      DATABASE_USERNAME: postgres
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-postgres}
      JWT_SECRET: ${JWT_SECRET:-voice2sense_production_jwt_secret_key_change_me_in_prod_min_32_chars}
      TRANSLATION_API_KEY: ${TRANSLATION_API_KEY:-}
      SPRING_PROFILES_ACTIVE: prod
      PORT: 8080
    ports:
      - "8080:8080"

volumes:
  postgres_data:
  redis_data:
