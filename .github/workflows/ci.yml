name: Voice2Sense CI/CD Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-test-and-build:
    name: Backend Java Spring Boot Build & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: voice2sense_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build with Maven
        working-directory: ./backend
        run: mvn -B clean package --file pom.xml
        env:
          DATABASE_URL: jdbc:postgresql://localhost:5432/voice2sense_db
          DATABASE_USERNAME: postgres
          DATABASE_PASSWORD: postgrespassword
          JWT_SECRET: voice2sense_ci_test_jwt_secret_key_minimum_32_characters

      - name: Run Backend Unit & Integration Tests
        working-directory: ./backend
        run: mvn test

  frontend-build:
    name: Mobile Web Client Build & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Lint & Typecheck
        run: npm run lint

      - name: Build Web Bundle
        run: npm run build
